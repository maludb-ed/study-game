# Include inside the studygame TLS vhost. The two READ servers are client-facing
# (bearer tokens checked by the services); the assistant and actions layers are
# never exposed — PHP reaches them on localhost only.
#
# Off (not On): the MCP StreamableHTTP transport's DNS-rebinding guard rejects any
# Host header without its own port (returns 421). Off makes Apache send the backend
# its own host:port (127.0.0.1:8901/8902), which the guard accepts, regardless of the
# external hostname clients use. (On was fine on the Mac where clients hit the port
# directly; behind Apache it breaks every request.)
ProxyPreserveHost Off
ProxyPass        /mcp/records  http://127.0.0.1:8901/mcp retry=0 timeout=30
ProxyPassReverse /mcp/records  http://127.0.0.1:8901/mcp
ProxyPass        /mcp/activity http://127.0.0.1:8902/mcp retry=0 timeout=30
ProxyPassReverse /mcp/activity http://127.0.0.1:8902/mcp
# Nothing proxies to 8765 (assistant): PHP calls it server-side.
